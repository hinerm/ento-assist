[project]
name = "ento-assist"
version = "0.1.0"
description = "LLM-assisted insect identification via MCP server and structured dichotomous key graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pymupdf>=1.24.0",
    "surya-ocr>=0.6.0",
    "click>=8.1.0",
    "python-frontmatter>=1.1.0",
]

[project.scripts]
ento-assist = "ento_assist.server:main"
ento-merge = "ento_assist.utils.merge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ento_assist"]
