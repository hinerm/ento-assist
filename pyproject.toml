[project]
name = "ento-assist"
version = "0.1.0"
description = "LLM-assisted insect identification via MCP server and structured dichotomous key graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pymupdf>=1.24.0",
    "surya-ocr>=0.6.0",
    "click>=8.1.0",
    "python-frontmatter>=1.1.0",
]

[project.scripts]
ento-assist = "ento_assist.server:main"
ento-merge = "ento_assist.utils.merge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ento_assist"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
    "licenseheaders>=0.8.8",
]

# ---------------------------------------------------------------------------
# Ruff — formatter + linter + import sorter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ento_assist"]

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # surya-ocr / pymupdf have no stubs

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ento_assist --cov-report=term-missing"
